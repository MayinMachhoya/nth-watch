services:
  - type: web
    name: nth-watch-ml
    runtime: python
    rootDir: flask
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: INTERNAL_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
